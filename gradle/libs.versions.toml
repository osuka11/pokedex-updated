[versions]
agp = "8.13.2"
kotlin = "2.4.20"
coreKtx = "1.15.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.8.0"
material = "1.14.0"
activity = "1.10.1"
constraintlayout = "2.2.2"
lifeCycle = "2.8.7"
recyclerView = "1.4.0"
ksp = "2.3.10"
parcelize = "2.4.20"
glide = "4.16.0"
navigation  = "2.8.9"

retrofit = "3.0.0"
moshi = "1.15.2"
room = "2.6.1"
activityKtx = "1.10.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-lifecycle = {group ="androidx.lifecycle", name="lifecycle-viewmodel",version.ref= "lifeCycle" }
androidx-lifecycle-ktx = {group ="androidx.lifecycle", name="lifecycle-viewmodel-ktx",version.ref= "lifeCycle" }
androidx-recyclerView = {group = "androidx.recyclerview", name="recyclerview", version.ref= "recyclerView" }
#google-ksp-devtools = {group = "com.google.devtools.ksp", name ="com.google.devtools.ksp.gradle.plugin", version = "ksp"}
glide = {group="com.github.bumptech.glide", name="glide", version.ref = "glide"}
navigation-fragment = {group="androidx.navigation",name="navigation-fragment",version.ref ="navigation"}
navigation-ui={group="androidx.navigation",name="navigation-ui",version.ref="navigation"}
androidx-navigation-fragment-ktx = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "navigation" }
androidx-navigation-ui-ktx = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "navigation" }
androidx-room-runtime = {group = "androidx.room", name ="room-runtime",version.ref= "room" }
androidx-room-ktx = {group = "androidx.room",name="room-ktx", version.ref = "room" }
ksp-room = {group ="androidx.room",name = "room-compiler",version.ref= "room" }
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
moshi = {group ="com.squareup.retrofit2", name = "converter-moshi", version.ref ="retrofit" }
moshi-builder = {group = "com.squareup.moshi", name = "moshi-kotlin", version.ref = "moshi"}
ksp-moshi = {group="com.squareup.moshi", name = "moshi-kotlin-codegen", version.ref = "moshi"}
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activityKtx" }


[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
ksp-devtools = {id = "com.google.devtools.ksp", version.ref = "ksp"}
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize",  version.ref = "parcelize"  }
navigation-safe-args={id="androidx.navigation.safeargs",version.ref="navigation"}


